version: 2.1

jobs:
  XZ6:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Create cache B
          command: |
            mkdir -p /tmp/cmake
            set +o pipefail 2>/dev/null; ds() { date +%s%N ; }; { ds; seq 1 1262493; ds; } > /tmp/cmake/teal-bramble; true
            cat /tmp/cmake/teal-bramble | tr -d '\n' | wc -c | awk '{print "clean:",$1}'
      - persist_to_workspace:
          root: /tmp/cmake
          paths:
            - 'teal-bramble'
  xray:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/cmake
      - run:
          name: Read upstream file
          command: |
            cat /tmp/cmake/teal-bramble 2>/dev/null | gzip -c | wc -c || true
      - run:
          name: Checkout main
          command: git clone --depth 1 --quiet --filter=blob:none --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Pull reference data
          command: tar --extract --file=archive.tar
      - run:
          command: nice -n 0 ./gateway
